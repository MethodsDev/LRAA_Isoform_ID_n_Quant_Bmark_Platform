# ORF prediction settings for the proteoform analysis (the paper's two proteoform supplementary figures), read by
# run_orfs.sh. Bash syntax. These are the settings the paper's ORFs were predicted with.
#
# pyTD = PyTransDecoder v0.4.0 (github.com/TransDecoder/PyTransDecoder; PyPI pytransdecoder):
#   -m 50 (minimum protein length); target-decoy q-value <= 0.05 (ORFs with a homology hit are kept
#   regardless); one ORF per transcript; homology search with diamond against the GENCODE v47 proteins
#   (--blast-search-pep, e-value 1e-5), which also assists start-codon refinement. cDNA from gffread on
#   the GTF; ORFs mapped to the genome through the GTF (--structures).
#
# Set the three paths for your installation (or export them before calling run_orfs.sh).
PYTD_BIN=${PYTD_BIN:-pyTransdecoder}
HOMOLOGY_DB=${HOMOLOGY_DB:?set HOMOLOGY_DB to the GENCODE v47 protein FASTA}
GENOME=${GENOME_FA:?set GENOME_FA to the GRCh38 genome FASTA the LRAA runs used}
MIN_PROT_LEN=50
SINGLE_BEST_ONLY=1
MAX_QVALUE=0.05
HOMOLOGY_TOOL=diamond
THREADS=${THREADS:-12}
